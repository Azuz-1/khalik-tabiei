name: Stage D audited lock refresh

on:
  push:
    branches: [hardening/d-ops]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/d-ops
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compatible audit repair to lockfile
        run: |
          rm -rf node_modules server/node_modules client/node_modules
          npm audit fix --package-lock-only --ignore-scripts
          node --input-type=module -e "import lock from './package-lock.json' with { type: 'json' }; const v=lock.packages['node_modules/qs']?.version; console.log('resolved qs', v); if (v !== '6.16.0') process.exit(1)"
      - name: Verify clean install and production audit
        run: |
          npm ci --ignore-scripts
          npm ls qs
          npm audit --omit=dev
      - name: Commit audited lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: resolve qs security advisory in lockfile"
          git push origin HEAD:hardening/d-ops
