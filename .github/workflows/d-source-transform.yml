name: Stage D source transform

on:
  push:
    branches: [hardening/d-ops]

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/d-ops
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/stage-d-transform.mjs
      - name: Commit transformed sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared/types.ts client/src/i18n/errors.ts client/src/net/socket.ts server/src/config.ts server/src/game/roomManager.ts server/src/game/engine.ts server/src/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: add Stage D prompt spacing and graceful drain"
          git push origin HEAD:hardening/d-ops
