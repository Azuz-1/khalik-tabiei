name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run real WebSocket integration E2E
        run: |
          npm start > /tmp/khalik-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..40}; do
            if curl --fail --silent http://localhost:8080/api/session >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/khalik-server.log
              exit 1
            fi
            sleep 0.25
          done

          curl --fail --silent http://localhost:8080/api/session >/dev/null
          npm run test:integration
        env:
          PUBLIC_ORIGIN: http://localhost:8080
          SESSION_SECRET: integration-test-secret-0123456789-abcdef
      - run: npm audit --omit=dev --audit-level=high
        env:
          NODE_ENV: development
