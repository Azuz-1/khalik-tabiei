name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Server tests A1 — adversarial/analytics/audio
        working-directory: server
        run: >-
          node --import tsx --test
          test/adversarial*.test.ts test/analytics*.test.ts test/audio*.test.ts
      - name: Server tests A2 — challenge/client/competitive/copy
        working-directory: server
        run: >-
          node --import tsx --test
          test/challenge*.test.ts test/client*.test.ts test/competitive*.test.ts
          test/copy*.test.ts
      - name: Server tests A3 — display/engine
        working-directory: server
        run: node --import tsx --test test/display*.test.ts test/engine*.test.ts
      - name: Server tests A4 — acceptance/stage/gameplay
        working-directory: server
        run: >-
          node --import tsx --test
          test/full-game*.test.ts test/game-stage*.test.ts test/gameplay*.test.ts
      - name: Server tests A5 — hardening
        working-directory: server
        run: node --import tsx --test test/hardening*.test.ts
      - name: Server tests A6.1 — home
        working-directory: server
        run: node --import tsx --test test/home*.test.ts
      - name: Server tests A6.2 — host
        working-directory: server
        run: node --import tsx --test test/host*.test.ts
      - name: Server tests A6.3 — imitation prompts
        working-directory: server
        run: node --import tsx --test test/imitation*.test.ts
      - name: Server tests A6.4 — intermediate result
        working-directory: server
        run: node --import tsx --test test/intermediate*.test.ts
      - name: Server tests A6.5 — liveness
        working-directory: server
        run: node --import tsx --test test/liveness*.test.ts
      - name: Server tests group B — ownership/play style
        working-directory: server
        run: >-
          node --import tsx --test
          test/owner*.test.ts test/party*.test.ts test/play-style*.test.ts
          test/policy*.test.ts
      - name: Server tests group C — prompt history/content
        working-directory: server
        run: node --import tsx --test test/prompt*.test.ts
      - name: Server tests group D — remaining/security
        working-directory: server
        run: >-
          node --import tsx --test
          test/ready*.test.ts test/removal*.test.ts test/result*.test.ts
          test/room*.test.ts test/security*.test.ts test/start*.test.ts
          test/suggestions*.test.ts test/ux*.test.ts test/version*.test.ts
          test/view*.test.ts test/voting*.test.ts test/ws*.test.ts
      - run: npm run build
      - name: Run real WebSocket integration E2E
        run: |
          npm start > /tmp/khalik-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..40}; do
            if curl --fail --silent http://localhost:8080/readyz >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/khalik-server.log
              exit 1
            fi
            sleep 0.25
          done

          curl --fail --silent http://localhost:8080/readyz >/dev/null
          npm run test:integration
        env:
          PUBLIC_ORIGIN: http://localhost:8080
          SESSION_SECRET: integration-test-secret-0123456789-abcdef
      - name: Production dependency audit
        run: npm audit --omit=dev
        env:
          NODE_ENV: development
      - name: Full dependency audit
        run: npm audit
        env:
          NODE_ENV: development
      - name: Build production container
        run: docker build -t khalik-tabiei:ci .
      - name: Inspect and smoke-test production container
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' khalik-tabiei:ci)" = "node"
          docker run --rm --entrypoint sh khalik-tabiei:ci -c 'test ! -e node_modules/tsx && test ! -e node_modules/typescript'
          CID=$(docker run -d --rm -p 18080:8080 \
            -e PUBLIC_ORIGIN=https://example.invalid \
            -e SESSION_SECRET=container-smoke-secret-0123456789-abcdef \
            khalik-tabiei:ci)
          cleanup() { docker stop "$CID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://localhost:18080/readyz >/dev/null; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' "$CID" 2>/dev/null | grep -q true; then
              docker logs "$CID"
              exit 1
            fi
            sleep 0.25
          done
          curl --fail --silent http://localhost:18080/healthz >/dev/null
          curl --fail --silent http://localhost:18080/readyz >/dev/null
          docker logs "$CID"

  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install pinned Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.62.1
      - name: Install pinned Chromium runtime
        run: npx playwright@1.62.1 install --with-deps chromium
      - name: Run real browser Host and Player flows
        run: npx playwright@1.62.1 test --config=playwright.config.mjs
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage-d-browser-failure
          path: |
            playwright-report
            test-results/browser
          if-no-files-found: ignore
          retention-days: 7
