name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run real WebSocket integration E2E
        run: |
          npm start > /tmp/khalik-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..40}; do
            if curl --fail --silent http://localhost:8080/api/session >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/khalik-server.log
              exit 1
            fi
            sleep 0.25
          done

          curl --fail --silent http://localhost:8080/api/session >/dev/null
          npm run test:integration
        env:
          PUBLIC_ORIGIN: http://localhost:8080
          SESSION_SECRET: integration-test-secret-0123456789-abcdef
      - run: npm audit --omit=dev --audit-level=high
        env:
          NODE_ENV: development

  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install pinned Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.62.1
      - name: Install pinned Chromium runtime
        run: npx playwright@1.62.1 install --with-deps chromium
      - name: Run real browser Host and Player flows
        run: npx playwright@1.62.1 test --config=playwright.config.mjs
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage-c-browser-failure
          path: |
            playwright-report
            test-results/browser
          if-no-files-found: ignore
          retention-days: 7
