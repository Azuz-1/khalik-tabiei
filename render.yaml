# One-click Render Blueprint. The production service uses the same verified
# multi-stage, non-root Docker runtime exercised in CI.
services:
  - type: web
    name: khalik-tabiei
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    # Application drain defaults to 10 seconds; leave process-level headroom
    # before Render is allowed to force termination.
    maxShutdownDelaySeconds: 15
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_ORIGIN
        sync: false
